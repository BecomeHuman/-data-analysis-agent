<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析智能助手</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* 左侧对话区域 */
        .chat-panel {
            width: 420px;
            background: #16213e;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f3460;
        }

        .chat-header {
            padding: 20px;
            background: #0f3460;
            color: white;
            text-align: center;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #1f4068;
            color: #e8e8e8;
            border-bottom-left-radius: 4px;
        }

        .message.file-upload {
            background: #2d5a27;
            border: 1px solid #4a9c3d;
        }

        .message.file-upload .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message.file-upload .file-icon {
            font-size: 1.5rem;
        }

        .message .timestamp {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        .message .chart-hint {
            background: rgba(102, 126, 234, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 3px solid #667eea;
        }

        .message .chart-hint strong {
            color: #667eea;
        }

        /* 聊天输入区域 */
        .chat-input-area {
            padding: 15px;
            background: #0f3460;
            border-top: 1px solid #1a1a2e;
        }

        .file-upload-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .file-upload-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            color: #e8e8e8;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .file-upload-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #667eea;
        }

        .file-upload-btn input {
            display: none;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input:focus {
            border-color: #667eea;
            background: rgba(255,255,255,0.15);
        }

        .chat-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(102,126,234,0.5);
        }

        /* 右侧图表区域 */
        .chart-panel {
            flex: 1;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chart-header {
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-header h2 {
            color: #2c3e50;
            font-size: 1.3rem;
        }

        .chart-actions {
            display: flex;
            gap: 10px;
        }

        .chart-btn {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            color: #666;
        }

        .chart-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .chart-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* Markdown 样式 */
        .md-tabs {
            display: flex;
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            gap: 10px;
        }

        .md-tab {
            padding: 8px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .md-tab.active {
            background: #667eea;
            color: white;
        }

        .md-editor-container {
            height: calc(100% - 60px);
            display: none;
        }

        .md-editor-container.active {
            display: flex;
        }

        .md-editor {
            flex: 1;
            padding: 20px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .md-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 10px;
        }

        .md-editor-title {
            font-weight: bold;
            color: #333;
        }

        .md-textarea {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            resize: none;
            line-height: 1.6;
        }

        .md-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .md-preview {
            flex: 1;
            padding: 20px;
            background: white;
            border-left: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .md-preview h1 { font-size: 2em; margin: 0.67em 0; color: #1a1a2e; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .md-preview h2 { font-size: 1.5em; margin: 0.83em 0; color: #1a1a2e; border-bottom: 1px solid #e0e0e0; padding-bottom: 8px; }
        .md-preview h3 { font-size: 1.17em; margin: 1em 0; color: #333; }
        .md-preview p { margin: 1em 0; line-height: 1.8; color: #444; }
        .md-preview ul, .md-preview ol { margin: 1em 0; padding-left: 2em; }
        .md-preview li { margin: 0.5em 0; line-height: 1.6; }
        .md-preview code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #e83e8c; }
        .md-preview pre { background: #1a1a2e; color: #fff; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 1em 0; }
        .md-preview pre code { background: none; color: inherit; padding: 0; }
        .md-preview blockquote { border-left: 4px solid #667eea; margin: 1em 0; padding: 10px 20px; background: #f8f9fa; color: #666; }
        .md-preview table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        .md-preview th, .md-preview td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        .md-preview th { background: #667eea; color: white; }
        .md-preview tr:nth-child(even) { background: #f9f9f9; }
        .md-preview a { color: #667eea; text-decoration: none; }
        .md-preview a:hover { text-decoration: underline; }
        .md-preview img { max-width: 100%; border-radius: 8px; }
        .md-preview hr { border: none; border-top: 1px solid #ddd; margin: 2em 0; }

        .md-toolbar {
            display: flex;
            gap: 8px;
        }

        .md-tool-btn {
            padding: 6px 12px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .md-tool-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 图表类型选择器 */
        .chart-type-bar {
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chart-type-btn {
            padding: 8px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-type-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .chart-type-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        /* 图表容器 */
        .chart-container-wrapper {
            flex: 1;
            padding: 25px;
            overflow: auto;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            height: 100%;
        }

        .chart-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chart-card-header {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-card-title {
            font-weight: 600;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-card-actions {
            display: flex;
            gap: 8px;
        }

        .mini-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 0.8rem;
        }

        .mini-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .chart-card-body {
            flex: 1;
            padding: 15px;
            min-height: 300px;
        }

        /* 空状态 */
        .empty-chart-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .empty-chart-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-chart-state p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .empty-chart-state .hint {
            font-size: 0.9rem;
            color: #bbb;
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 滚动条样式 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .chat-panel {
                width: 100%;
                height: 50vh;
            }
            
            .chart-panel {
                height: 50vh;
            }
        }

        /* SQL代码块 */
        .sql-block {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            margin: 10px 0;
        }

        .sql-block .keyword {
            color: #569cd6;
        }

        .sql-block .string {
            color: #ce9178;
        }

        .sql-block .number {
            color: #b5cea8;
        }

        /* 分析结果列表 */
        .analysis-list {
            margin: 10px 0;
        }

        .analysis-list li {
            margin: 5px 0;
            padding-left: 10px;
        }

        /* 全屏模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-body {
            height: calc(100% - 70px);
            padding: 20px;
        }

        .modal-close {
            width: 35px;
            height: 35px;
            border: none;
            background: #e0e0e0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #e74c3c;
            color: white;
        }

        /* 文件预览 */
        .file-preview {
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-preview .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-preview .remove {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .file-preview .remove:hover {
            opacity: 1;
            color: #e74c3c;
        }
    </style>
</head>

    <div class="app-container">
        <!-- 左侧对话区域 -->
        <div class="chat-panel">
            <div class="chat-header">
                <h2>🤖 数据分析助手</h2>
                <p>智能问答 · SQL生成 · 图表推荐</p>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div>👋 你好！我是数据分析助手，可以帮助你：</div>
                    <ul style="margin: 10px 0 0 20px;">
                        <li>📊 分析销售数据</li>
                        <li>📝 生成SQL查询语句</li>
                        <li>📈 生成可视化图表</li>
                        <li>📄 解读文档内容</li>
                    </ul>
                    <div style="margin-top: 10px;">请上传文件或输入你的问题~</div>
                    <div class="timestamp">系统 · 刚刚</div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="file-upload-row">
                    <label class="file-upload-btn" id="fileUploadLabel">

                        <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" onchange="handleFileSelect(this)">
                    </label>
                    <div id="filePreview" style="display: none; flex: 1;" class="file-preview">
                        <span id="fileName"></span>
                        <span class="remove" onclick="clearFile()">✕</span>
                    </div>
                </div>
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="输入你的数据分析问题..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>

        <!-- 右侧图表区域 -->
        <div class="chart-panel">
            <div class="chart-header">
                <h2>📈 数据可视化</h2>
                <div class="chart-actions">
                    <button class="chart-btn" onclick="refreshCharts()">🔄 刷新</button>
                    <button class="chart-btn" onclick="exportAllCharts()">📥 导出全部</button>
                </div>
            </div>

            <!-- Markdown 标签页 -->
            <div class="md-tabs">
                <button class="md-tab active" onclick="switchRightPanel('charts')">📊 图表</button>
                <button class="md-tab" onclick="switchRightPanel('markdown')">📝 Markdown</button>
            </div>

            <!-- Markdown 编辑器容器 -->
            <div class="md-editor-container" id="mdEditorContainer">
                <div class="md-editor">
                    <div class="md-editor-header">
                        <span class="md-editor-title">📝 Markdown 编辑器</span>
                        <div class="md-toolbar">
                            <button class="md-tool-btn" onclick="insertMd('**', '**')">加粗</button>
                            <button class="md-tool-btn" onclick="insertMd('*', '*')">斜体</button>
                            <button class="md-tool-btn" onclick="insertMd('\n- ', '')">列表</button>
                            <button class="md-tool-btn" onclick="insertMd('\n```\n', '\n```')">代码</button>
                            <button class="md-tool-btn" onclick="insertMd('\n> ', '')">引用</button>
                            <button class="md-tool-btn" onclick="insertMd('\n| 表头1 | 表头2 |\n|------|------|\n| ', ' | 数据 |\n')">表格</button>
                            <button class="md-tool-btn" onclick="previewMarkdown()">👁️ 预览</button>
                            <button class="md-tool-btn" onclick="copyMarkdown()">📋 复制</button>
                            <button class="md-tool-btn" onclick="downloadMarkdown()">💾 下载</button>
                        </div>
                    </div>

" oninput="updateMarkdownPreview()"></textarea>
                    <div class="md-preview" id="mdPreview"></div>
                </div>
            </div>

            <div class="chart-type-bar" id="chartTypeBar">
                <div class="chart-type-btn active" data-type="bar" onclick="switchChartType('bar')">
                    📊 柱状图
                </div>
                <div class="chart-type-btn" data-type="line" onclick="switchChartType('line')">
                    📈 折线图
                </div>
                <div class="chart-type-btn" data-type="pie" onclick="switchChartType('pie')">
                    🥧 饼图
                </div>
                <div class="chart-type-btn" data-type="scatter" onclick="switchChartType('scatter')">
                    ⚪ 散点图
                </div>
                <div class="chart-type-btn" data-type="area" onclick="switchChartType('area')">
                    🏔️ 面积图
                </div>
                <div class="chart-type-btn" data-type="radar" onclick="switchChartType('radar')">
                    🕸️ 雷达图
                </div>
            </div>

            <div class="chart-container-wrapper">
                <div class="charts-grid" id="chartsGrid">
                    <!-- 主图表 -->
                    <div class="chart-card">
                        <div class="chart-card-header">
                            <div class="chart-card-title">
                                <span>📊</span>
                                <span id="mainChartTitle">地区销售对比</span>
                            </div>
                            <div class="chart-card-actions">
                                <button class="mini-btn" onclick="expandChart('mainChart')" title="全屏">⛶</button>
                                <button class="mini-btn" onclick="exportChart('mainChart')" title="导出">📥</button>
                            </div>
                        </div>
                        <div class="chart-card-body">
                            <div id="mainChart" style="width: 100%; height: 100%;"></div>
                        </div>
                    </div>

                    <!-- 副图表 -->
                    <div class="chart-card">
                        <div class="chart-card-header">
                            <div class="chart-card-title">
                                <span>📈</span>
                                <span id="secondChartTitle">销售趋势</span>
                            </div>
                            <div class="chart-card-actions">
                                <button class="mini-btn" onclick="expandChart('secondChart')" title="全屏">⛶</button>
                                <button class="mini-btn" onclick="exportChart('secondChart')" title="导出">📥</button>
                            </div>
                        </div>
                        <div class="chart-card-body">
                            <div id="secondChart" style="width: 100%; height: 100%;"></div>
                        </div>
                    </div>

                    <!-- 第三个图表 -->
                    <div class="chart-card">
                        <div class="chart-card-header">
                            <div class="chart-card-title">
                                <span>🥧</span>
                                <span id="thirdChartTitle">销售占比</span>
                            </div>
                            <div class="chart-card-actions">
                                <button class="mini-btn" onclick="expandChart('thirdChart')" title="全屏">⛶</button>
                                <button class="mini-btn" onclick="exportChart('thirdChart')" title="导出">📥</button>
                            </div>
                        </div>
                        <div class="chart-card-body">
                            <div id="thirdChart" style="width: 100%; height: 100%;"></div>
                        </div>
                    </div>

                    <!-- 第四个图表 -->
                    <div class="chart-card">
                        <div class="chart-card-header">
                            <div class="chart-card-title">
                                <span>⚪</span>
                                <span id="fourthChartTitle">数据分布</span>
                            </div>
                            <div class="chart-card-actions">
                                <button class="mini-btn" onclick="expandChart('fourthChart')" title="全屏">⛶</button>
                                <button class="mini-btn" onclick="exportChart('fourthChart')" title="导出">📥</button>
                            </div>
                        </div>
                        <div class="chart-card-body">
                            <div id="fourthChart" style="width: 100%; height: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 全屏模态框 -->
    <div class="modal" id="fullscreenModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">图表详情</span>
                <button class="modal-close" onclick="closeFullscreen()">✕</button>
            </div>
            <div class="modal-body">
                <div id="fullscreenChart" style="width: 100%; height: 100%;"></div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let charts = {};
        let currentChartType = 'bar';
        let currentFile = null;
        let chartOptions = {};
        let currentRightPanel = 'charts';

        // 示例数据
        const sampleData = {
            regions: ['华东', '华北', '华南', '华中', '东北', '西南', '西北'],
            sales: [859, 754, 381, 350, 328, 214, 125],
            months: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
            trend: [120, 145, 180, 165, 190, 220, 250, 280, 260, 310, 350, 380],
            categories: ['电子产品', '服装', '食品', '家居', '图书'],
            categorySales: [450, 320, 280, 180, 120]
        };

        // Markdown 功能
        function switchRightPanel(panel) {
            currentRightPanel = panel;
            const tabs = document.querySelectorAll('.md-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            const mdContainer = document.getElementById('mdEditorContainer');
            const chartTypeBar = document.getElementById('chartTypeBar');
            const chartWrapper = document.querySelector('.chart-container-wrapper');
            
            if (panel === 'markdown') {
                mdContainer.classList.add('active');
                chartTypeBar.style.display = 'none';
                chartWrapper.style.display = 'none';
                updateMarkdownPreview();
            } else {
                mdContainer.classList.remove('active');
                chartTypeBar.style.display = 'flex';
                chartWrapper.style.display = 'block';
            }
        }

        function updateMarkdownPreview() {
            const textarea = document.getElementById('mdTextarea');
            const preview = document.getElementById('mdPreview');
            if (textarea && preview && typeof marked !== 'undefined') {
                preview.innerHTML = marked.parse(textarea.value);
            }
        }

        function insertMd(before, after) {
            const textarea = document.getElementById('mdTextarea');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(start, end);
            textarea.value = text.substring(0, start) + before + selected + after + text.substring(end);
            textarea.focus();
            textarea.selectionStart = start + before.length;
            textarea.selectionEnd = start + before.length + selected.length;
            updateMarkdownPreview();
        }

        function previewMarkdown() {
            const preview = document.getElementById('mdPreview');
            const mdEditor = document.querySelector('.md-editor');
            const currentDisplay = preview.style.display;
            
            if (currentDisplay === 'none' || !currentDisplay) {
                preview.style.display = 'block';
                mdEditor.querySelector('.md-textarea').style.display = 'none';
            } else {
                preview.style.display = 'none';
                mdEditor.querySelector('.md-textarea').style.display = 'flex';
            }
            updateMarkdownPreview();
        }

        function copyMarkdown() {
            const textarea = document.getElementById('mdTextarea');
            navigator.clipboard.writeText(textarea.value).then(() => {
                showToast('✅ Markdown 已复制到剪贴板');
            });
        }

        function downloadMarkdown() {
            const textarea = document.getElementById('mdTextarea');
            const blob = new Blob([textarea.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'report_' + new Date().toISOString().slice(0,10) + '.md';
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ Markdown 文件已下载');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toast.style.cssText = 'position:fixed;top:20px;right:20px;background:#667eea;color:white;padding:12px 24px;border-radius:8px;z-index:9999;animation:slideIn 0.3s ease';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 初始化图表
        function initCharts() {
            // 主图表 - 柱状图
            charts.mainChart = echarts.init(document.getElementById('mainChart'));
            chartOptions.mainChart = generateBarOption(sampleData.regions, sampleData.sales, '地区销售对比');
            charts.mainChart.setOption(chartOptions.mainChart);

            // 第二图表 - 折线图
            charts.secondChart = echarts.init(document.getElementById('secondChart'));
            chartOptions.secondChart = generateLineOption(sampleData.months, sampleData.trend, '月度销售趋势');
            charts.secondChart.setOption(chartOptions.secondChart);

            // 第三图表 - 饼图
            charts.thirdChart = echarts.init(document.getElementById('thirdChart'));
            chartOptions.thirdChart = generatePieOption(sampleData.categories, sampleData.categorySales, '产品类别占比');
            charts.thirdChart.setOption(chartOptions.thirdChart);

            // 第四图表 - 散点图
            charts.fourthChart = echarts.init(document.getElementById('fourthChart'));
            chartOptions.fourthChart = generateScatterOption('销售与利润关系');
            charts.fourthChart.setOption(chartOptions.fourthChart);

            // 监听窗口变化
            window.addEventListener('resize', () => {
                Object.values(charts).forEach(chart => chart.resize());
            });
        }

        // 生成柱状图配置
        function generateBarOption(xData, yData, title) {
            return {
                title: { text: title, left: 'center', textStyle: { fontSize: 14, fontWeight: 'bold' } },
                tooltip: { trigger: 'axis' },
                grid: { left: '10%', right: '5%', bottom: '15%', top: '20%' },
                xAxis: { type: 'category', data: xData, axisLabel: { rotate: 0 } },
                yAxis: { type: 'value', name: '销售额(万)' },
                series: [{
                    type: 'bar',
                    data: yData,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#667eea' },
                            { offset: 1, color: '#764ba2' }
                        ]),
                        borderRadius: [4, 4, 0, 0]
                    },
                    label: { show: true, position: 'top', formatter: '{c}' }
                }]
            };
        }

        // 生成折线图配置
        function generateLineOption(xData, yData, title) {
            return {
                title: { text: title, left: 'center', textStyle: { fontSize: 14, fontWeight: 'bold' } },
                tooltip: { trigger: 'axis' },
                grid: { left: '10%', right: '5%', bottom: '15%', top: '20%' },
                xAxis: { type: 'category', data: xData, boundaryGap: false },
                yAxis: { type: 'value', name: '销售额(万)' },
                series: [{
                    type: 'line',
                    data: yData,
                    smooth: true,
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(102,126,234,0.5)' },
                            { offset: 1, color: 'rgba(102,126,234,0.1)' }
                        ])
                    },
                    itemStyle: { color: '#667eea' },
                    label: { show: true, position: 'top' }
                }]
            };
        }

        // 生成饼图配置
        function generatePieOption(names, values, title) {
            const pieData = names.map((name, i) => ({ name, value: values[i] }));
            return {
                title: { text: title, left: 'center', textStyle: { fontSize: 14, fontWeight: 'bold' } },
                tooltip: { trigger: 'item', formatter: '{b}: {c}万 ({d}%)' },
                legend: { orient: 'vertical', left: 'left', top: 'middle' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['60%', '50%'],
                    data: pieData,
                    emphasis: {
                        itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.5)' }
                    },
                    label: { formatter: '{b}: {d}%' }
                }]
            };
        }

        // 生成散点图配置
        function generateScatterOption(title) {
            const scatterData = sampleData.sales.map((v, i) => [
                v, 
                v * (0.6 + Math.random() * 0.4),
                v * (0.8 + Math.random() * 0.4)
            ]);
            return {
                title: { text: title, left: 'center', textStyle: { fontSize: 14, fontWeight: 'bold' } },
                tooltip: { trigger: 'item' },
                grid: { left: '10%', right: '5%', bottom: '15%', top: '20%' },
                xAxis: { type: 'value', name: '销售额', splitLine: { lineStyle: { type: 'dashed' } } },
                yAxis: { type: 'value', name: '利润', splitLine: { lineStyle: { type: 'dashed' } } },
                series: [{
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 15,
                    itemStyle: { color: '#764ba2', opacity: 0.7 }
                }]
            };
        }

        // 生成面积图配置
        function generateAreaOption(xData, yData, title) {
            return {
                title: { text: title, left: 'center', textStyle: { fontSize: 14, fontWeight: 'bold' } },
                tooltip: { trigger: 'axis' },
                grid: { left: '10%', right: '5%', bottom: '15%', top: '20%' },
                xAxis: { type: 'category', data: xData, boundaryGap: false },
                yAxis: { type: 'value', name: '数值' },
                series: [{
                    type: 'line',
                    data: yData,
                    smooth: true,
                    areaStyle: {},
                    itemStyle: { color: '#73A0FA' }
                }]
            };
        }

        // 生成雷达图配置
        function generateRadarOption(title) {
            return {
                title: { text: title, left: 'center', textStyle: { fontSize: 14, fontWeight: 'bold' } },
                tooltip: {},
                radar: {
                    indicator: [
                        { name: '销售', max: 1000 },
                        { name: '利润', max: 500 },
                        { name: '增长', max: 100 },
                        { name: '客户', max: 1000 },
                        { name: '复购', max: 100 }
                    ],
                    center: ['50%', '55%']
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: [850, 420, 85, 680, 72],
                        name: '业务指标',
                        areaStyle: { color: 'rgba(102,126,234,0.5)' },
                        itemStyle: { color: '#667eea' }
                    }]
                }]
            };
        }

        // 切换图表类型
        function switchChartType(type) {
            currentChartType = type;
            
            // 更新按钮状态
            document.querySelectorAll('.chart-type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });

            // 更新所有图表
            if (type === 'bar') {
                charts.mainChart.setOption(generateBarOption(sampleData.regions, sampleData.sales, '地区销售对比'));
                charts.secondChart.setOption(generateLineOption(sampleData.months, sampleData.trend, '月度销售趋势'));
                charts.thirdChart.setOption(generatePieOption(sampleData.categories, sampleData.categorySales, '产品类别占比'));
                charts.fourthChart.setOption(generateScatterOption('销售与利润关系'));
            } else if (type === 'line') {
                charts.mainChart.setOption(generateLineOption(sampleData.regions, sampleData.sales, '地区销售趋势'));
                charts.secondChart.setOption(generateLineOption(sampleData.months, sampleData.trend, '月度销售趋势'));
                charts.thirdChart.setOption(generateLineOption(sampleData.categories, sampleData.categorySales, '产品销售趋势'));
                charts.fourthChart.setOption(generateLineOption(sampleData.regions, sampleData.sales.map(v => v * 0.7), '利润趋势'));
            } else if (type === 'pie') {
                charts.mainChart.setOption(generatePieOption(sampleData.regions, sampleData.sales, '地区销售占比'));
                charts.secondChart.setOption(generatePieOption(sampleData.months.slice(0, 6), sampleData.trend.slice(0, 6), '上半年销售占比'));
                charts.thirdChart.setOption(generatePieOption(sampleData.categories, sampleData.categorySales, '产品类别占比'));
                charts.fourthChart.setOption(generatePieOption(sampleData.regions.slice(0, 5), sampleData.sales.slice(0, 5), 'TOP5地区占比'));
            } else if (type === 'scatter') {
                charts.mainChart.setOption(generateScatterOption('地区销售与利润关系'));
                charts.secondChart.setOption(generateScatterOption('月度销售与增长关系'));
                charts.thirdChart.setOption(generateScatterOption('产品销售与利润关系'));
                charts.fourthChart.setOption(generateScatterOption('客户购买与价值关系'));
            } else if (type === 'area') {
                charts.mainChart.setOption(generateAreaOption(sampleData.regions, sampleData.sales, '地区销售面积图'));
                charts.secondChart.setOption(generateAreaOption(sampleData.months, sampleData.trend, '月度销售面积图'));
                charts.thirdChart.setOption(generateAreaOption(sampleData.categories, sampleData.categorySales, '产品销售面积图'));
                charts.fourthChart.setOption(generateAreaOption(sampleData.regions, sampleData.sales.map(v => v * 0.8), '利润面积图'));
            } else if (type === 'radar') {
                charts.mainChart.setOption(generateRadarOption('综合业务指标'));
                charts.secondChart.setOption(generateRadarOption('华东地区指标'));
                charts.thirdChart.setOption(generateRadarOption('华北地区指标'));
                charts.fourthChart.setOption(generateRadarOption('华南地区指标'));
            }
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message && !currentFile) {
                return;
            }

            // 添加用户消息
            addMessage('user', message || `📎 上传了文件: ${currentFile.name}`);
            
            input.value = '';

            // 添加加载指示器
            const loadingId = addLoadingMessage();

            // 模拟AI响应
            setTimeout(() => {
                removeLoadingMessage(loadingId);
                
                // 根据输入生成响应
                const response = generateAIResponse(message);
                addMessage('bot', response);
                
                // 更新图表
                if (response.includes('柱状图')) {
                    switchChartType('bar');
                } else if (response.includes('折线图') || response.includes('趋势')) {
                    switchChartType('line');
                } else if (response.includes('饼图') || response.includes('占比')) {
                    switchChartType('pie');
                }
            }, 1500);
        }

        // 生成AI响应
        function generateAIResponse(message) {
            const lowerMsg = message.toLowerCase();
            
            if (lowerMsg.includes('销售') || lowerMsg.includes('地区')) {
                return `根据您的需求，我为您生成了以下分析：

**📊 地区销售分析**
- 华东地区表现最佳，销售额 859 万
- 华北地区紧随其后，销售额 754 万
- 西北地区有较大增长空间

**SQL查询已生成：**
\`\`\`sql
SELECT region, SUM(sales_amount) as total 
FROM sales_table 
WHERE date >= '2024-01-01' 
GROUP BY region 
ORDER BY total DESC
\`\`\`

右侧图表已更新为柱状图展示。`;
            } else if (lowerMsg.includes('趋势') || lowerMsg.includes('月度')) {
                return `为您分析了销售趋势：

**📈 月度趋势发现**
- 下半年销售明显高于上半年
- 10-12月为销售旺季
- 环比增长率约 15%

已切换为折线图展示趋势变化。`;
            } else if (lowerMsg.includes('占比') || lowerMsg.includes('分类')) {
                return `产品类别占比分析：

**🥧 类别销售占比**
- 电子产品占 35%（最高）
- 服装类占 25%
- 食品类占 22%

已切换为饼图展示占比分布。`;
            } else if (lowerMsg.includes('客户') || lowerMsg.includes('用户')) {
                return `客户分析结果：

**👥 客户洞察**
- 高价值客户占比 20%，贡献 65% 营收
- 客户复购率平均为 32%
- 华东地区客户活跃度最高

已更新相关性散点图。`;
            } else {
                return `我已经理解您的需求！

**已为您准备：**
- 📊 柱状图 - 地区销售对比
- 📈 折线图 - 销售趋势
- 🥧 饼图 - 产品占比
- ⚪ 散点图 - 数据分布

您可以点击上方的图表类型按钮切换不同视图，或上传文件进行更深入的分析。`;
            }
        }

        // 添加消息到聊天区域
        function addMessage(type, content) {
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div>${content.replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')}</div>
                <div class="timestamp">${type === 'user' ? '你' : '助手'} · ${time}</div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 添加加载消息
        function addLoadingMessage() {
            const container = document.getElementById('chatMessages');
            const id = 'loading-' + Date.now();
            
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.id = id;
            loadingDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;
            
            return id;
        }

        // 移除加载消息
        function removeLoadingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // 处理回车发送
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 文件选择处理
        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            currentFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('filePreview').style.display = 'flex';
            
            // 显示上传消息
            addMessage('user', `📎 上传了文件: ${file.name}`);
            
            // 模拟分析
            const loadingId = addLoadingMessage();
            
            setTimeout(() => {
                removeLoadingMessage(loadingId);
                
                const fileType = getFileType(file.name);
                let response = `文件已上传成功！\n\n`;
                response += `**📄 文件信息**\n`;
                response += `- 文件名: ${file.name}\n`;
                response += `- 类型: ${fileType}\n`;
                response += `- 大小: ${(file.size / 1024).toFixed(1)} KB\n\n`;
                response += `**🔍 分析结果**\n`;
                response += `- 检测到 ${fileType} 格式文件\n`;
                response += `- 数据已加载，准备生成可视化图表\n\n`;
                response += `<div class="chart-hint">`;
                response += `<strong>💡 提示</strong>：根据文件内容，已为您准备了销售数据分析图表。`;
                response += `</div>`;
                
                addMessage('bot', response);
                
                // 自动切换到合适的图表
                if (fileType === 'Excel' || fileType === 'CSV') {
                    switchChartType('bar');
                }
            }, 2000);
        }

        // 获取文件类型
        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const types = {
                'pdf': 'PDF文档',
                'doc': 'Word文档',
                'docx': 'Word文档',
                'xls': 'Excel表格',
                'xlsx': 'Excel表格',
                'csv': 'CSV数据',
                'txt': '文本文件'
            };
            return types[ext] || '未知格式';
        }

        // 清除文件
        function clearFile() {
            currentFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').style.display = 'none';
        }

        // 刷新图表
        function refreshCharts() {
            Object.values(charts).forEach(chart => chart.resize());
        }

        // 导出单个图表
        function exportChart(chartId) {
            const chart = charts[chartId];
            if (!chart) return;

            const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#fff' });
            const link = document.createElement('a');
            link.download = `${chartId}.png`;
            link.href = url;
            link.click();
        }

        // 导出全部图表
        function exportAllCharts() {
            Object.keys(charts).forEach((chartId, index) => {
                setTimeout(() => exportChart(chartId), index * 500);
            });
        }

        // 全屏查看图表
        function expandChart(chartId) {
            const modal = document.getElementById('fullscreenModal');
            const fullscreenChart = echarts.init(document.getElementById('fullscreenChart'));
            
            const titles = {
                'mainChart': '地区销售对比',
                'secondChart': '销售趋势',
                'thirdChart': '销售占比',
                'fourthChart': '数据分布'
            };
            
            document.getElementById('modalTitle').textContent = titles[chartId] || '图表详情';
            
            const originalOption = chartOptions[chartId] || charts[chartId].getOption();
            fullscreenChart.setOption(originalOption);
            
            modal.classList.add('active');
            
            // 监听窗口变化
            fullscreenChart.resize();
        }

        // 关闭全屏
        function closeFullscreen() {
            document.getElementById('fullscreenModal').classList.remove('active');
            echarts.getInstanceByDom(document.getElementById('fullscreenChart'))?.dispose();
        }

        // 点击模态框外部关闭
        document.getElementById('fullscreenModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeFullscreen();
            }
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            updateMarkdownPreview();
        });
    </script>
</body>
</html>
